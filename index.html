<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>INNOVA-FIS-LAB · Acceso</title>
<style>html,body{margin:0;height:100%;background:#f4f6f8;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#1b2430}
.box{max-width:420px;margin:12vh auto 0;background:#fff;border:1px solid #e2e6eb;border-radius:16px;padding:34px 32px;box-shadow:0 8px 30px rgba(0,0,0,.06)}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:1.25rem;margin-bottom:18px}
p{color:#5b6676;margin:0 0 20px;line-height:1.5}label{font-weight:600;font-size:.95rem}
input{width:100%;box-sizing:border-box;margin:8px 0 16px;padding:12px 14px;font-size:1.05rem;border:1.5px solid #c9d0d8;border-radius:10px}
input:focus{outline:none;border-color:#2f6fb7}
button{width:100%;padding:12px;border:0;border-radius:10px;background:#1b2430;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer}
button:hover{background:#2c3a4d}button:hover{background:#2c3a4d}button:disabled{opacity:.6}#msg{min-height:1.4em;margin-top:14px;color:#c0392b;font-size:.95rem}</style></head>
<body><div class="box"><div class="logo"><svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="#070c15"/><rect x="7" y="7" width="2.4" height="20" fill="#7a5cff"/><rect x="11.5" y="7" width="2.4" height="20" fill="#2fb7e8"/><rect x="17" y="7" width="2.4" height="20" fill="#57d163"/><rect x="21" y="7" width="2.4" height="20" fill="#f4a62a"/><rect x="25.5" y="7" width="2.4" height="20" fill="#ff4d4d"/></svg>INNOVA-FIS-LAB</div>
<p>Web en revisión, solo para los miembros del grupo. Escribe la contraseña para entrar. Acceso válido hasta el domingo 2 de noviembre.</p>
<form id="f"><label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" autofocus required><button id="b" type="submit">Entrar</button></form><div id="msg"></div></div>
<script>
const CFG={"salt": "2832e78c5ddd17f2054bd72a209820d6", "iter": 310000};
let BASE="/";
async function findBase(){const d=location.pathname.split("/").slice(0,-1);for(let i=1;i<=d.length;i++){const pre=d.slice(0,i).join("/")+"/";try{const r=await fetch(pre+"check.bin",{cache:"no-cache"});if(r.ok&&(r.headers.get("content-type")||"").indexOf("html")<0){BASE=pre;return}}catch(e){}}}
function hex(h){return new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)))}
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open("ifl",1);r.onupgradeneeded=()=>r.result.createObjectStore("k");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function save(k){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("k","readwrite");t.objectStore("k").put(k,"key");t.oncomplete=res;t.onerror=()=>rej(t.error)})}
const msg=document.getElementById("msg"),b=document.getElementById("b");const EXP=Date.UTC(2026,10,2,23,0,0);
if(Date.now()>EXP){document.getElementById("f").style.display="none";msg.textContent="El acceso de revisión ha caducado. Pide la nueva contraseña al coordinador del grupo."}
if(!("serviceWorker" in navigator)||!window.crypto||!crypto.subtle){msg.textContent="Este navegador no permite abrir la web. Prueba con Chrome, Edge, Firefox o Safari actualizados."}
document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();b.disabled=true;msg.style.color="#5b6676";msg.textContent="Comprobando…";
 try{await findBase();const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(document.getElementById("pw").value),"PBKDF2",false,["deriveKey"]);
  const kp=await crypto.subtle.deriveKey({name:"PBKDF2",salt:hex(CFG.salt),iterations:CFG.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const c=new Uint8Array(await (await fetch(BASE+"pc0.bin",{cache:"no-cache"})).arrayBuffer());
  const raw=await crypto.subtle.decrypt({name:"AES-GCM",iv:c.slice(0,12)},kp,c.slice(12));
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  await save(k);
  const reg=await navigator.serviceWorker.register(BASE+"sw.js",{scope:BASE});await navigator.serviceWorker.ready;
  if(reg.active)reg.active.postMessage("forget");
  if(!navigator.serviceWorker.controller){await new Promise(r=>{navigator.serviceWorker.addEventListener("controllerchange",r,{once:true});setTimeout(r,4000)})}
  msg.textContent="Abriendo… (la primera vez tarda unos segundos)";
  const dest=(location.pathname===BASE+"acceso.html")?BASE:location.pathname+location.search;
  setTimeout(()=>location.reload(),20000);
  if(location.hash)location.replace(dest+(dest.indexOf("?")<0?"?":"&")+"r="+Date.now()+location.hash);else if(dest===location.pathname+location.search)location.reload();else location.replace(dest);
 }catch(err){msg.style.color="#c0392b";msg.textContent="Contraseña incorrecta.";b.disabled=false}});
</script></body></html>
